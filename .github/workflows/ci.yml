name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: XrayCore/go.mod
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: |
          command -v shellcheck
          actionlint -color

      - name: Check tracked shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

  android:
    name: Android arm64 debug checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android NDK
        shell: bash
        run: |
          NDK_VERSION=$(awk -F '"' '/ndkVersion/ {print $2}' app/build.gradle.kts)
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: XrayCore/go.mod
          cache-dependency-path: |
            XrayCore/go.sum
            XrayCore/libXray/go.sum
            XrayCore/Xray-core/go.sum
            XrayHelper/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads this fixture at test runtime, outside Gradle's dependency cache.
      # Keep the artifact pinned to the Robolectric version and @Config(sdk = [34]).
      - name: Cache Robolectric Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented/14-robolectric-10818077-i7
          key: robolectric-android-all-14-robolectric-10818077-i7-v1

      - name: Prefetch Robolectric Android SDK
        shell: bash
        run: |
          set -euo pipefail
          version="14-robolectric-10818077-i7"
          base="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/${version}/android-all-instrumented-${version}"
          dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/${version}"
          jar="$dir/android-all-instrumented-${version}.jar"
          pom="$dir/android-all-instrumented-${version}.pom"
          jar_sha="$jar.sha512"
          pom_sha="$pom.sha512"
          if [[ -s "$jar" && -s "$jar_sha" && -s "$pom" && -s "$pom_sha" ]] &&
            [[ "$(sha512sum "$jar" | awk '{print $1}')" == "$(tr -d '[:space:]' < "$jar_sha")" ]] &&
            [[ "$(sha512sum "$pom" | awk '{print $1}')" == "$(tr -d '[:space:]' < "$pom_sha")" ]]; then
            exit 0
          fi
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          for suffix in .pom .pom.sha512 .jar .jar.sha512; do
            curl --fail --location --silent --show-error \
              --retry 10 --retry-all-errors --retry-delay 3 \
              --output "$temp/android-all-instrumented-${version}${suffix}" \
              "${base}${suffix}"
          done
          for artifact in pom jar; do
            expected="$(tr -d '[:space:]' < "$temp/android-all-instrumented-${version}.${artifact}.sha512")"
            actual="$(sha512sum "$temp/android-all-instrumented-${version}.${artifact}" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]]
          done
          mkdir -p "$dir"
          mv "$temp"/android-all-instrumented-"${version}"* "$dir"/

      - name: Prepare Xray router test geodata
        working-directory: XrayCore/Xray-core
        run: |
          mkdir -p resources
          # Pin test data so rule updates cannot change regression results.
          curl --fail --location --silent --show-error \
            --output resources/geosite.dat \
            https://raw.githubusercontent.com/XTLS/Xray-rules-dat/b2fd201b17cdbb2a6aff5e49a52910247d026778/geosite/geosite-expand.dat

      - name: Prepare pinned host Cronet runtime
        working-directory: XrayCore
        run: |
          go mod download github.com/sagernet/cronet-go/lib/linux_amd64
          cronet_dir=$(go list -mod=readonly -m -f '{{.Dir}}' github.com/sagernet/cronet-go/lib/linux_amd64)
          echo "LD_LIBRARY_PATH=$cronet_dir" >> "$GITHUB_ENV"

      - name: Run native compatibility, live routing and cancellation regressions
        working-directory: XrayCore
        run: |
          go test -mod=readonly -tags=with_naive_outbound,with_purego -race -count=1 -timeout=240s . ./lib \
            github.com/xtls/xray-core/app/observatory \
            github.com/xtls/xray-core/app/router \
            github.com/xtls/xray-core/app/proxyman/outbound \
            github.com/xtls/xray-core/transport/internet \
            github.com/xtls/xray-core/transport/internet/tls \
            github.com/xtls/xray-core/transport/internet/splithttp \
            github.com/xtls/xray-core/infra/conf \
            github.com/xtls/xray-core/proxy/naive
          go test -mod=readonly -tags=with_naive_outbound,with_purego -count=1 -timeout=90s github.com/xtls/libxray/nodep github.com/xtls/libxray/share

      - name: Run core splice transition regressions
        working-directory: XrayCore/Xray-core
        run: go test -mod=readonly -race -count=1 -timeout=90s ./proxy ./common/mux ./proxy/socks ./proxy/http ./proxy/loopback

      - name: Build XrayCore (arm64)
        run: bash -e ./buildXrayCore.sh arm64

      - name: Build XrayHelper (arm64)
        run: bash -e ./buildXrayHelper.sh arm64

      - name: Build debug APK, run full lint and JVM unit tests
        run: |
          ./gradlew \
            -PabiTarget=arm64-v8a \
            --continue \
            :app:assembleDebug \
            :app:lintDebug \
            :app:testDebugUnitTest

      - name: Upload lint and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaxc-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7

  device-regressions:
    name: Android x86_64 / ${{ matrix.page-size }} byte pages
    needs: android
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: default
            page-size: 4096
          - target: google_apis_ps16k
            page-size: 16384
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install pinned Android NDK
        shell: bash
        run: |
          NDK_VERSION=$(awk -F '"' '/ndkVersion/ {print $2}' app/build.gradle.kts)
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: XrayCore/go.mod
          cache-dependency-path: |
            XrayCore/go.sum
            XrayCore/libXray/go.sum
            XrayCore/Xray-core/go.sum
            XrayHelper/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build emulator-native dependencies
        run: |
          bash -e ./buildXrayCore.sh amd64
          bash -e ./buildXrayHelper.sh amd64

      - name: Enable disposable runner KVM access
        run: sudo chmod a+rw /dev/kvm

      - name: Run isolated native and VPN instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          emulator-build: '15507667' # 36.6.11; exercised with both page-size images.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: >-
            ./gradlew -PabiTarget=x86_64
            -Pandroid.testInstrumentationRunnerArguments.allowVpn=true
            -Pandroid.testInstrumentationRunnerArguments.expectedPageSize=${{ matrix.page-size }}
            :app:connectedRegressionAndroidTest

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-${{ matrix.page-size }}-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
