name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: XrayCore/go.mod
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: |
          command -v shellcheck
          actionlint -color

      - name: Check tracked shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

  android:
    name: Android arm64 debug checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android NDK
        shell: bash
        run: |
          NDK_VERSION=$(awk -F '"' '/ndkVersion/ {print $2}' app/build.gradle.kts)
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: XrayCore/go.mod
          cache-dependency-path: |
            XrayCore/go.sum
            XrayCore/libXray/go.sum
            XrayCore/Xray-core/go.sum
            XrayHelper/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run native compatibility, ownership and cancellation regressions
        working-directory: XrayCore
        run: |
          go test -mod=readonly -race -count=1 -timeout=90s .
          go test -mod=readonly -count=1 -timeout=30s github.com/xtls/libxray/nodep

      - name: Run core splice transition regressions
        working-directory: XrayCore/Xray-core
        run: go test -mod=readonly -race -count=1 -timeout=90s ./proxy ./common/mux ./proxy/socks ./proxy/http ./proxy/loopback

      - name: Build XrayCore (arm64)
        run: bash -e ./buildXrayCore.sh arm64

      - name: Build XrayHelper (arm64)
        run: bash -e ./buildXrayHelper.sh arm64

      - name: Build debug APK, run full lint and JVM unit tests
        run: |
          ./gradlew \
            -PabiId=2 \
            -PabiTarget=arm64-v8a \
            --continue \
            :app:assembleDebug \
            :app:lintDebug \
            :app:testDebugUnitTest

      - name: Upload lint and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaxc-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
